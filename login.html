<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Skill Swap Hub</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">⚡ SkillSwap</a>
  <div class="nav-links">
    <a href="register.html"><button class="btn btn-primary">Register</button></a>
  </div>
</nav>

<div class="form-page">
  <div class="form-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to continue swapping skills</p>

    <div class="alert" id="login-alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="you@email.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password" required/>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Log In →</button>
    </form>

    <div class="form-footer">
      Don't have an account? <a href="register.html">Register free</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
