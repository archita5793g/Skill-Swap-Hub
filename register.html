<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Skill Swap Hub</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">⚡ SkillSwap</a>
  <div class="nav-links">
    <a href="login.html"><button class="btn btn-outline">Log In</button></a>
  </div>
</nav>

<div class="form-page">
  <div class="form-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join the skill-sharing community for free</p>

    <div class="alert" id="reg-alert"></div>

    <form id="register-form">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="reg-name" placeholder="Your name" required/>
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="reg-email" placeholder="you@email.com" required/>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="reg-password" placeholder="Create a password" required/>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Create Account →
      </button>
    </form>

    <div class="form-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>

    <div style="margin-top:1rem;padding:0.8rem;background:var(--surface2);border-radius:8px;font-size:0.82rem;color:var(--muted);line-height:1.6">
      💡 <strong style="color:var(--text)">After registering</strong>, go to
      <em>My Profile & Skills</em> in the dashboard to add your skills and bio!
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
